# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: ARCH Stack Overflow — design vault
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: null
  locale: en-US
  baseUrl: pandinhatv.github.io/arch-vault-site
  ignorePatterns:
    - private
    - Templates
    - .obsidian
    - .trash
    - Attachments/Documents/Books
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      # Frutiger Aero is built on humanist sans-serif type. Frutiger itself is
      # not free; Nunito Sans and Open Sans are its closest relatives on Google
      # Fonts — rounded, warm, early-2000s-OS friendly.
      header: Nunito Sans
      body: Open Sans
      code: IBM Plex Mono
    colors:
      # Palette from the project's own art direction: green, blue, glass, sky,
      # with aqua dominant. Light mode is the real one — Frutiger Aero is a
      # bright, optimistic aesthetic and goes grey and sad in the dark.
      lightMode:
        light: "#eef7fc"
        lightgray: "#cfe4f0"
        gray: "#8ab2c8"
        darkgray: "#35505e"
        dark: "#0f2430"
        secondary: "#0b84c4"
        tertiary: "#35b48f"
        highlight: rgba(104, 192, 232, 0.15)
        textHighlight: "#9fe3ff88"
      # Deep water rather than neutral grey — the Aquatic level at depth.
      darkMode:
        light: "#081a24"
        lightgray: "#153240"
        gray: "#4d8099"
        darkgray: "#cde5f0"
        dark: "#eaf6fb"
        secondary: "#4fc3f7"
        tertiary: "#5fd6ac"
        highlight: rgba(79, 195, 247, 0.12)
        textHighlight: "#2c7ea688"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      # `git` dropped: the notes live outside any repo (see README), so Quartz
      # would warn "couldn't find git repository" on every build.
      priority:
        - frontmatter
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  # DISABLED: the ToC renders outside the encrypted block, so it would publish
  # every heading of every protected page in plaintext.
  - source: "@quartz-community/table-of-contents"
    enabled: false
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: tokyo-night
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  # Only notes with `publish: true` in frontmatter are built.
  # Private by default — see Website - Publishing Plan in the vault.
  - source: "@quartz-community/explicit-publish"
    enabled: true
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  # DISABLED: this writes a CNAME file from baseUrl, which GitHub Pages reads as
  # a CUSTOM DOMAIN request. baseUrl here is pandinhatv.github.io/arch-vault-site,
  # so it emitted "pandinhatv.github.io" — the user-pages apex, not this project.
  # That fights with serving the project at /arch-vault-site. No custom domain is
  # in use, so the file should not exist.
  - source: "@quartz-community/cname"
    enabled: false
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    options:
      # Clicking a folder opens/closes it in the sidebar instead of loading a
      # folder page — folder pages are built before unlock, so they show
      # nothing for encrypted notes.
      folderClickBehavior: collapse
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        Built with Quartz: https://quartz.jzhao.xyz
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      # tags removed: they render outside the encrypted block
      includedProperties:
        - description
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      # Protected pages are hidden from search, graph, explorer, RSS and sitemap
      # until someone decrypts one. Their metadata is encrypted separately.
      unlistWhenEncrypted: true
      outputPath: static/encryptedContentIndex.json
    order: 900
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
